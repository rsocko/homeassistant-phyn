leak_test:
  name: Start a leak test
  description: Starts a leak test for a phyn smart valve
  fields:
    entity_id:
      name: Valve
      description: Valve to run leak test from
      required: true
      selector:
        entity:
          domain: valve
    extended:
      name: Extended Test
      description: Extended leak test
      required: true
      default: false
      selector:
        boolean:

import_fixture_statistics:
  name: Import fixture statistics
  description: Import fixture water usage events into Home Assistant long-term statistics
  fields:
    entity_id:
      name: Entity
      description: Any entity for the target Phyn device (optional)
      required: false
      selector:
        entity: {}
    device_id:
      name: Device ID
      description: Target Phyn device id (optional, used when entity_id is not set)
      required: false
      selector:
        text:
    days:
      name: Days
      description: Relative lookback window when start/end are not provided
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    start_datetime:
      name: Start datetime
      description: Optional explicit start time (must be paired with end_datetime)
      required: false
      selector:
        datetime:
    end_datetime:
      name: End datetime
      description: Optional explicit end time (must be paired with start_datetime)
      required: false
      selector:
        datetime: